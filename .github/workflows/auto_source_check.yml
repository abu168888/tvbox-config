name: Auto Source Health Check & Replace

on:
  schedule:
    # 每天凌晨 3 点（北京时间）执行
    - cron: '0 3 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  check-sources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run health check
        run: |
          python github_auto_check.py
        env:
          TZ: 'Asia/Shanghai'
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changes detected
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'tvbox-bot'
          git config --global user.email 'bot@abu.tvbox'
          
          # 添加所有变更
          git add .
          
          # 生成提交信息
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Auto update: Source health check (${{ github.run_id }}) - ${TIMESTAMP}" || echo "No changes to commit"
          
          # 推送到仓库
          git push origin main || echo "Push failed, might be no new changes"
      
      - name: Summary report
        run: |
          echo "=== Auto Source Check Report ===" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f source_manager_report.json ]; then
            echo "Latest stats:" >> $GITHUB_STEP_SUMMARY
            cat source_manager_report.json | head -20 >> $GITHUB_STEP_SUMMARY
          fi
