name: Auto Source Health Check & Daily Report

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  health-check-and-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run source health check
        run: |
          python github_auto_check.py
      
      - name: Generate daily report
        run: |
          python daily_report.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: daily-report
          path: daily_report_*.md
          retention-days: 30
      
      - name: Commit and push if changes detected
        run: |
          git config --global user.name 'tvbox-bot'
          git config --global user.email 'bot@abu.tvbox'
          
          git add .
          
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Auto daily report (${{ github.run_id }}) - ${TIMESTAMP}" || echo "No changes"
          
          git push origin main || echo "Push skipped"
