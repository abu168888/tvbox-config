name: Auto Collect & Monitor

on:
  schedule:
    # Daily health check at 3AM Beijing time (UTC 19:00)
    - cron: '0 19 * * *'
    # Weekly new source collection on Sunday at 4AM Beijing time (UTC 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      action_type:
        description: '执行操作类型'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - collect_only
          - monitor_only
          - clean_failures

jobs:
  auto-maintenance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Step 1: Collect new sources (weekly or manual)
      - name: Run collector (weekly)
        if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * 0' || github.event_name == 'workflow_dispatch' && contains(github.event.inputs.action_type, 'collect')
        run: python auto_collector.py
        continue-on-error: true

      # Step 2: Monitor health (daily or manual)
      - name: Run monitor system (daily)
        if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch' && contains(github.event.inputs.action_type, 'monitor')
        run: |
          python monitor_system.py
          echo "Monitoring complete"
        continue-on-error: true

      # Step 3: Track and clean failed sites (daily)
      - name: Track failures and auto-clean
        if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch' && contains(github.event.inputs.action_type, 'clean')
        run: |
          # Auto-remove sites that failed for 7+ consecutive days
          echo "y" | python track_failures.py
        continue-on-error: true

      # Step 4: Commit all changes
      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all changed files
          git add .
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto maintenance: $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # Step 5: Upload reports as artifacts
      - name: Upload health report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report-$(date '+%Y%m%d')
          path: |
            health_report.html
            collection_results.json
            failure_tracking.json
          retention-days: 14
          overwrite: true
